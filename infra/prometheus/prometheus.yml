global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: backend
    metrics_path: /internal/metrics
    static_configs:
      - targets: ['backend:3001']
  - job_name: notifications
    metrics_path: /internal/metrics
    static_configs:
      - targets: ['notifications:3002']
